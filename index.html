<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>DMED Documents</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
    }

    .container {
        text-align: center;
        margin-top: 80px;
    }

    .logo {
        font-size: 28px;
        font-weight: bold;
        color: #2b6cb0;
    }

    .logo span {
        color: #4fd1c5;
    }

    h2 {
        margin-top: 40px;
        font-weight: 500;
    }

    .pin-box {
        margin-top: 20px;
    }

    input {
        width: 50px;
        height: 50px;
        margin: 5px;
        font-size: 22px;
        text-align: center;
        border: 1px solid #ccc;
        border-radius: 6px;
    }

    button {
        margin-top: 20px;
        padding: 12px 40px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        background: #ddd;
        cursor: pointer;
    }

    button:hover {
        background: #ccc;
    }

    .lang {
        position: absolute;
        right: 20px;
        top: 20px;
        border: 1px solid #ccc;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 14px;
    }
</style>
</head>
<body>

<div class="lang">🇷🇺 Русский</div>

<div class="container">
    <div class="logo"><span>*</span> DMED Documents</div>

    <h2>Введите PIN-код для<br>просмотра документа</h2>

    <div class="pin-box">
        <input type="text" maxlength="1" id="p1">
        <input type="text" maxlength="1" id="p2">
        <input type="text" maxlength="1" id="p3">
        <input type="text" maxlength="1" id="p4">
    </div>

    <button onclick="checkPin()">Открыть</button>
</div>

<script>
function checkPin() {
    let pin =
        document.getElementById("p1").value +
        document.getElementById("p2").value +
        document.getElementById("p3").value +
        document.getElementById("p4").value;

    if (pin === "3665") {
        window.open("file.pdf", "_blank"); // PDF nomini shu yerga yozasiz
    } else {
        alert("Неверный PIN-код");
    }
}

// avtomatik keyingi inputga o'tish
const inputs = document.querySelectorAll("input");
inputs.forEach((input, index) => {
    input.addEventListener("input", () => {
        if (input.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }
    });
});
</script>

</body>
</html>
